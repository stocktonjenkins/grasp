[project]
name = "grasp"
version = "1.0.0"
description = "GRASP: Graph Agentic Search over Propositions for multi-hop question answering"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "datasets==2.14.7",
    "google-api-core>=2.24",
    "google-genai>=1.61.0",
    "langchain-core>=1.2",
    "langchain-google-genai>=4.2.0",
    "langchain-openai>=0.3.0",
    "neo4j>=6.1.0",
    "numpy>=2.2.6",
    "polars>=1.37.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0.0",
    "tenacity>=8.2.0",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.1",
    "ulid>=1.1",
]

[project.scripts]
grasp = "grasp.cli:main"

[dependency-groups]
dev = ["ruff>=0.15.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grasp"]

[tool.ruff]
line-length = 140
